<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>POUR-OVER COFFEE · Branding</title><meta name="description" content="SLOW COFFEE BETTER DAYS. 퍼오버 커피 브랜딩 디자인."><style>
:root{--brown:#411d09;--beige:#d7cdc3;--paper:#f3f2ef;--gap:22px}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--brown);font-family:Georgia,'Times New Roman',serif}main{max-width:1440px;padding:23px;margin:auto}.top{display:grid;grid-template-columns:1.13fr 1fr;gap:var(--gap);margin-bottom:var(--gap)}figure{margin:0;overflow:hidden;border-radius:12px;background:var(--paper)}img{display:block;width:100%;height:100%;object-fit:cover}.top figure{aspect-ratio:1.215}.top figure:last-child{aspect-ratio:1.078}.middle{display:grid;grid-template-columns:1.326fr 1.33fr 1fr;grid-template-rows:auto auto;gap:var(--gap)}.left{display:grid;grid-template-rows:226fr 320fr;gap:var(--gap)}.quote{background:var(--beige);border-radius:12px;display:flex;align-items:center;padding:34px 38px;font-size:clamp(14px,1.65vw,23px);line-height:1.15}.palette{border-radius:12px;background:var(--paper);padding:20px 23px;display:flex;flex-direction:column}.palette h1{font-size:clamp(20px,2.4vw,34px);font-weight:400;text-align:center;margin:0 0 20px}.colors{display:grid;grid-template-columns:1fr 1fr;gap:22px}.swatch{aspect-ratio:.64;border-radius:28px}.brown{background:var(--brown)}.beige{background:var(--beige)}.code{display:block;text-align:center;font-size:clamp(19px,2.4vw,32px);margin:20px 0 0;padding:0;border:0;background:none;color:var(--brown);font-family:inherit;width:100%;cursor:pointer}.code.light{color:#aa9787}.code:hover{text-decoration:underline;text-underline-offset:5px}.palette footer{border-top:1px solid #e2dcd5;margin-top:auto;padding-top:40px;padding-bottom:32px}.palette footer p{font-size:clamp(15px,1.65vw,23px);margin:15px 0}.palette footer small{font-size:10px}.right{grid-column:3;grid-row:1 / 3;display:grid;grid-template-rows:271fr 140fr 349fr 339fr;gap:var(--gap)}.right .quote{padding:20px 16px;justify-content:center;font-size:clamp(13px,1.45vw,20px)}.store{grid-column:1 / 3;aspect-ratio:781/575}.bottom{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap);margin-top:var(--gap)}.bottom figure{aspect-ratio:349/328}figure{cursor:zoom-in}dialog{padding:0;border:0;background:transparent;max-width:min(90vw,1100px);max-height:90vh;overflow:visible}dialog::backdrop{background:rgba(32,18,9,.8)}dialog img{max-height:85vh;width:auto;max-width:90vw;object-fit:contain;border-radius:10px}dialog button{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:var(--brown);font-size:24px;cursor:pointer}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;background:var(--brown);color:white;border-radius:30px;font-family:Arial,sans-serif;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}figure:focus-visible,.code:focus-visible{outline:3px solid #9d6b45;outline-offset:4px}@media(min-width:1440px){.left{min-height:700px}}@media(max-width:700px){:root{--gap:14px}main{padding:14px}.top{grid-template-columns:1fr 1fr}.middle{grid-template-columns:1fr 1fr}.left{min-height:360px}.palette{padding:16px 14px}.palette h1{font-size:21px}.colors{gap:12px}.swatch{border-radius:20px}.quote{padding:22px;font-size:15px}.palette footer{padding:18px 0 6px}.palette footer p{font-size:14px}.palette footer small{font-size:8px}.code{font-size:20px;margin-top:14px}.store{grid-row:2}.right{grid-column:1 / 3;grid-row:3;grid-template-columns:1fr 1fr;grid-template-rows:auto auto}.right figure{aspect-ratio:1}.right .quote{font-size:15px;grid-column:2;grid-row:1}.right figure:nth-of-type(2){grid-column:1;grid-row:2}.right figure:nth-of-type(3){grid-column:2;grid-row:2}.bottom{gap:14px}}@media(max-width:420px){.top{grid-template-columns:1fr}.top figure,.top figure:last-child{aspect-ratio:1.15}.middle{grid-template-columns:1fr}.left{min-height:0;grid-template-rows:150px auto}.left figure{aspect-ratio:380/320}.palette{grid-column:1;min-height:430px}.swatch{aspect-ratio:.85}.store{grid-column:1;grid-row:3}.right{grid-column:1;grid-row:4}.bottom{grid-template-columns:1fr}.bottom figure{aspect-ratio:1.1}.quote{font-size:17px}.palette h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main aria-label="퍼오버 커피 브랜딩 포트폴리오"><section class="top" aria-label="브랜드 로고와 패키지"><figure><img src="assets/logo.webp" alt="POUR-OVER COFFEE 원형 로고, SLOW COFFEE BETTER DAYS"></figure><figure><img src="assets/packaging.webp" alt="퍼오버 커피 종이 봉투와 선물 상자"></figure></section><section class="middle" aria-label="브랜드 색상과 적용 디자인"><div class="left"><div class="quote">SLOW COFFEE BETTER DAYS<br>A SLOWER BREW FOR A BETTER DAY.</div><figure><img src="assets/box.webp" alt="손잡이가 달린 베이지색 커피 패키지" loading="lazy"></figure></div><article class="palette"><h1>COLOR PALETTE</h1><div class="colors"><div><div class="swatch brown"></div><button class="code" data-color="#411D09" aria-label="브라운 색상 코드 #411D09 복사">#411D09</button></div><div><div class="swatch beige"></div><button class="code light" data-color="#D7CDC3" aria-label="베이지 색상 코드 #D7CDC3 복사">#D7CDC3</button></div></div><footer><p>SLOW COFFEE BETTER DAYS</p><small>A SLOWER BREW FOR A BETTER DAY.</small></footer></article><div class="right"><figure><img src="assets/cookie.webp" alt="브랜드 종이 포장에 담긴 쿠키" loading="lazy"></figure><div class="quote">A SMALL PAUSE IN EVERY CUP.</div><figure><img src="assets/cake.webp" alt="커피 로고 토퍼를 올린 치즈케이크" loading="lazy"></figure><figure><img src="assets/cups.webp" alt="퍼오버 커피 테이크아웃 핫 컵과 아이스 컵" loading="lazy"></figure></div><figure class="store"><img src="assets/store.webp" alt="따뜻한 햇살이 비추는 퍼오버 커피 매장" loading="lazy"></figure></section><section class="bottom" aria-label="브랜드 굿즈"><figure><img src="assets/plate.webp" alt="로고가 인쇄된 아이보리 접시" loading="lazy"></figure><figure><img src="assets/mug.webp" alt="퍼오버 커피 아이보리 머그컵" loading="lazy"></figure><figure><img src="assets/drip.webp" alt="퍼오버 커피 드립백 패키지" loading="lazy"></figure></section></main><dialog aria-label="이미지 확대 보기"><button aria-label="닫기">×</button><img alt=""></dialog><div id="toast" role="status"></div><script>
const dialog=document.querySelector('dialog'),large=dialog.querySelector('img');document.querySelectorAll('figure').forEach(f=>{f.tabIndex=0;f.setAttribute('role','button');f.setAttribute('aria-label',f.querySelector('img').alt+' 확대 보기');function open(){large.src=f.querySelector('img').src;large.alt=f.querySelector('img').alt;dialog.showModal()}f.addEventListener('click',open);f.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});dialog.querySelector('button').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=async()=>{const toast=document.querySelector('#toast');try{await navigator.clipboard.writeText(b.dataset.color);toast.textContent=b.dataset.color+' 복사 완료'}catch{toast.textContent='색상 코드: '+b.dataset.color}toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)});
</script></body></html>
